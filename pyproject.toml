[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-contract-checker"
version = "0.1.0"
description = "Flag risky clauses in influencer and creator agreements, with an optional Claude redraft and negotiation email."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishwajeet Kumbhar" }]
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
contract-check = "contract_checker.cli:main"

[tool.setuptools]
packages = ["contract_checker"]
